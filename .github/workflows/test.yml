name: Test formula

on:
  push:
  pull_request:

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Homebrew style
        run: docker run --rm -v "$PWD:/tap:ro" homebrew/brew:latest brew style /tap/Formula/harness.rb
      - name: Verify public macOS archive
        run: |
          curl -fL --retry 3 -o harness.tar.gz https://github.com/bhumirath/ai-harness-cli-project/releases/download/v0.2.2/harness-0.2.2-darwin-arm64.tar.gz
          echo "7f3d041d77bf205d303715df1f578913ae6a2fcac2d93374eb74b6af9a990d5a  harness.tar.gz" | sha256sum -c -
          tar -tzf harness.tar.gz | grep -Fx harness-0.2.2-darwin-arm64
