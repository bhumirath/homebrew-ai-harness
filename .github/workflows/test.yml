name: Test formula

on:
  push:
  pull_request:

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Homebrew style
        run: docker run --rm -v "$PWD:/tap:ro" homebrew/brew:latest brew style /tap/Formula/harness.rb
      - name: Verify public macOS archive
        run: |
          curl -fL --retry 3 -o harness.tar.gz https://github.com/bhumirath/ai-harness-cli-project/releases/download/v0.2.1/harness-0.2.1-darwin-arm64.tar.gz
          echo "1d9fdb944a7bbb67e13a36e9ca77a53e5fa8dc88f22aabbda3a91ccb520db62a  harness.tar.gz" | sha256sum -c -
          tar -tzf harness.tar.gz | grep -Fx harness-0.2.1-darwin-arm64
